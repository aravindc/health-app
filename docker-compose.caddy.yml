# Optional override for running behind a Caddy reverse proxy that lives in
# its own compose stack. Joins health-fe to Caddy's network so Caddy can
# proxy to it by service name (health-fe:80) without going through host
# ports. health-fe's nginx forwards /api to health-api itself, so
# health-api doesn't need to be on Caddy's network.
#
# Usage (see README "Running behind Caddy"):
#   CADDY_NETWORK=<caddy's network> \
#     docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
#
# Kept out of docker-compose.yml because an external network must already
# exist, which would break `up` on machines without Caddy.
services:
  health-fe:
    networks:
      - caddy
networks:
  caddy:
    name: ${CADDY_NETWORK:?set CADDY_NETWORK to the Caddy stack's network name}
    external: true
