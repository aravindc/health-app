[project]
name = "health-predict"
version = "0.1.0"
description = "Research system for predicting future glucose from CGM and insulin data. Not a medical device."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pytz>=2024.1",            # needed by duckdb to return TIMESTAMPTZ to Python
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
# Added in later phases; kept optional so Phase 1 installs quickly.
ml = ["scikit-learn>=1.5", "xgboost>=2.1", "lightgbm>=4.5", "shap>=0.46"]
dl = ["torch>=2.4"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "scikit-learn>=1.5"]   # serving only: no torch/xgboost/lightgbm
notebooks = ["jupyterlab>=4.2"]
dashboard = ["plotly>=5.24"]          # interactive HTML dashboard (Plotly embedded, works offline)

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
