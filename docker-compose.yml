# Every service sets container_name to its service name, so containers are
# named e.g. "health-db" instead of "health-app_health-db_1" (podman-compose)
# or "health-app-health-db-1" (Docker Compose). Container names are unique
# per engine: only one copy of this stack can run on a host at a time.
services:
  health-db:
    container_name: health-db
    # Pinned to a major version: moving to a new one needs a dump/restore or
    # pg_upgrade, since Postgres can't open another major's data files.
    image: docker.io/library/postgres:18
    networks:
      - health_be
    restart: on-failure
    ports:
      - "127.0.0.1:9084:5432"
    env_file:
      - ./.env
    volumes:
      # 18+ images keep data in /var/lib/postgresql/<major>/docker, so the
      # volume goes on /var/lib/postgresql (mounting .../data is rejected).
      - "./health-db/data:/var/lib/postgresql:Z"
  health-sync:
    container_name: health-sync
    networks:
      - health_be
    build: ./health-sync
    restart: always
    env_file:
      - ./.env
      - ./health-sync/.env
    environment:
      - DB_SSL_MODE=disable
    depends_on:
      health-db:
        condition: service_started
      health-api:
        condition: service_healthy
  health-mongo-sync:
    container_name: health-mongo-sync
    networks:
      - health_be
    build: ./health-mongo-sync
    restart: "no" # run once; use a one-shot restart policy
    env_file:
      - ./.env
      - ./health-mongo-sync/.env
    environment:
      - DB_SSL_MODE=disable
    depends_on:
      health-db:
        condition: service_started
      health-api:
        condition: service_healthy
  health-tandem-sync:
    container_name: health-tandem-sync
    networks:
      - health_be
    build:
      context: ./health-tandem-sync
      dockerfile: Dockerfile.tandemsync
    restart: always
    env_file:
      - ./.env
      - ./health-tandem-sync/.env
    environment:
      - DB_SSL_MODE=disable
      - SYNC_INTERVAL_SECONDS=900
    depends_on:
      health-db:
        condition: service_started
      health-api:
        condition: service_healthy
  health-api:
    container_name: health-api
    networks:
      - health_fe
      - health_be
    build: ./health-api
    ports:
      - "127.0.0.1:9082:8080"
    restart: on-failure
    env_file:
      - ./.env
      - ./health-api/.env
    # Defined here rather than as a Dockerfile HEALTHCHECK so it also works
    # under Podman (OCI images don't carry HEALTHCHECK).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 6
    depends_on:
      - health-db
  health-fe:
    container_name: health-fe
    networks:
      - health_fe
    build:
      context: ./health-fe
      args:
        # Used by the browser, not by containers. /api is proxied to
        # health-api by health-fe's nginx (see health-fe/nginx.conf).
        VITE_API_URL: ${VITE_API_URL:-/api}
        # Shown as <meta name="app-version"> to check which commit is deployed.
        # Set with GIT_SHA=$(git rev-parse --short HEAD) docker compose up --build.
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "127.0.0.1:9083:80"
    restart: on-failure
    depends_on:
      health-api:
        # nginx resolves health-api once at startup: wait until it exists,
        # and restart health-fe whenever health-api is recreated so nginx
        # picks up its new address.
        condition: service_healthy
        restart: true
  bytebase:
    container_name: bytebase
    image: docker.io/bytebase/bytebase:latest
    init: true
    networks:
      - health_be
    ports:
      - "127.0.0.1:9085:8080"
    volumes:
      - "./bytebase/data:/var/opt/bytebase:Z"
    restart: on-failure
# Created by compose on `up`. Fixed names (no project prefix) and subnets
# keep them stable across `down`/`up` and between Docker and Podman, so
# host firewall rules can match on the subnet.
networks:
  health_fe:
    name: health_fe
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.2.0/24
  health_be:
    name: health_be
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.3.0/24
