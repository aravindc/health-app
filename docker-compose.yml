services:
  health-db:
    image: postgres:latest
    networks:
      - health_be
    restart: on-failure
    ports:
      - "9084:5432"
    env_file:
      - ./.env
    volumes:
      - "./health-db/pg_data:/var/lib/postgresql/data"
  health-sync:
    networks:
      - health_be
    build: ./health-sync
    restart: always
    env_file:
      - ./.env
      - ./health-sync/.env
    environment:
      - DB_SSL_MODE=disable
    depends_on:
      health-db:
        condition: service_started
      health-api:
        condition: service_healthy
  health-mongo-sync:
    networks:
      - health_be
    build: ./health-mongo-sync
    restart: "no" # run once; use a one-shot restart policy
    env_file:
      - ./.env
      - ./health-mongo-sync/.env
    environment:
      - DB_SSL_MODE=disable
    depends_on:
      health-db:
        condition: service_started
      health-api:
        condition: service_healthy
  health-tandem-sync:
    networks:
      - health_be
    build:
      context: ./health-tandem-sync
      dockerfile: Dockerfile.tandemsync
    restart: always
    env_file:
      - ./.env
      - ./health-tandem-sync/.env
    environment:
      - DB_SSL_MODE=disable
      - SYNC_INTERVAL_SECONDS=3600
    depends_on:
      health-db:
        condition: service_started
      health-api:
        condition: service_healthy
  health-api:
    networks:
      - health_fe
      - health_be
    build: ./health-api
    ports:
      - "9082:8080"
    restart: on-failure
    env_file:
      - ./.env
      - ./health-api/.env
    depends_on:
      - health-db
  health-fe:
    networks:
      - health_fe
    build:
      context: ./health-fe
      args:
        VITE_API_URL: http://localhost:9082
    ports:
      - "9083:80"
    restart: on-failure
    depends_on:
      - health-api
  bytebase:
    image: bytebase/bytebase:latest
    init: true
    networks:
      - health_be
    ports:
      - "9085:8080"
    volumes:
      - "./bytebase/data:/var/opt/bytebase"
    restart: on-failure
networks:
  health_fe:
    driver: bridge
  health_be:
    driver: bridge
