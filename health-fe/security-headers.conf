# Security headers for every response. Included in the server block and
# again in any location that sets its own add_header, because nginx drops
# the inherited add_header directives in such a location.
#
# The UI loads nothing from other origins, and talks to the API on the
# same origin (/api), so the CSP allows only 'self'. React and Recharts
# set inline styles through the DOM (element.style), which CSP permits
# without 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
