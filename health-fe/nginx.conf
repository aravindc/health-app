server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API on the same origin as the UI, so the browser never does CORS.
    # The trailing slash on proxy_pass strips /api (/api/chart -> /chart).
    # nginx resolves health-api once at startup; compose restarts health-fe
    # when health-api is recreated (depends_on restart: true).
    # health-api serves Prometheus metrics on a separate internal port, not
    # through this proxy; refuse the path here too in case that changes.
    location = /api/metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://health-api:8080/;
        # $http_host keeps host:port, so Origin matches Host and health-api
        # treats the request as same-origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
